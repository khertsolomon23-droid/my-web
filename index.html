
<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>
    <link rel="stylesheet" href="stylee.css">
</head>
<body>

<header>
    <h2>Student Portal</h2>
</header>

<div class="container">

    <div class="welcome">
        <h1>Welcome, Student!</h1>
        <p>Welcome to your student dashboard.</p>
    </div>

    <div class="content">

        <div class="box">
            <h2>Student Profile</h2>
            <p><b>Name:</b> <span id="name"></span></p>
            <p><b>Course:</b> <span id="course"></span></p>
            <p><b>Year:</b> <span id="year"></span></p>
            <p><b>Student ID:</b> <span id="id"></span></p>
        </div>

        <div class="box">
            <h2>Announcements</h2>
            <p>Enrollment is now open!</p>
            <p>Please check your class schedule.</p>
            <p>Submit your requirements on time.</p>
        </div>

        <div class="box">
            <h2>My Subjects</h2>
            <ul id="subjects"></ul>
        </div>

    </div>

    <h2 class="registration">Student Registration</h2>

    <form id="registrationForm">
        <input type="text" id="studentName"
        placeholder="Enter your name" required>

        <input type="text" id="studentCourse"
        placeholder="Enter your course" required>

        <input type="text" id="studentYear"
        placeholder="Enter your year" required>

        <input type="text" id="studentID"
        placeholder="Enter your student ID" required>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>

</div>

<script src="script.js"></script>
</body>
</html>
